name: Fix table horizontal scroll
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix table horizontal scroll'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile table wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('materials-center/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.table-wrap{overflow:visible}', '.table-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials-center/index.html
          git diff --cached --quiet || (git commit -m 'Fix table horizontal scroll' && git push)
