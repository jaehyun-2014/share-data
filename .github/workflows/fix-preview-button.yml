name: Remove preview button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Remove preview button'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove preview button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('materials-center/index.html')
          s = p.read_text(encoding='utf-8')

          start = s.find('function materialRow(m){')
          end = s.find('function hydrateMaterialThumbs(){', start)
          if start == -1 or end == -1:
              raise SystemExit('materialRow region not found')

          region = s[start:end]
          region = re.sub(
              r'<button[^>]*class=["\'][^"\']*preview-btn[^"\']*["\'][^>]*>.*?</button>',
              '', region, flags=re.S
          )

          s = s[:start] + region + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials-center/index.html
          git diff --cached --quiet || (git commit -m 'Remove preview button' && git push)
