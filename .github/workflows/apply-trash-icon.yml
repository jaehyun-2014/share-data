name: Apply trash icon
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply trash icon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply trash icon
        env:
          ICON_B64: "iVBORw0KGgoAAAANSUhEUgAAAJcAAACfCAYAAAD0zEsUAAAGKUlEQVR42u2d"
        run: |
          python3 - <<'PY'
          import base64,re
          from pathlib import Path
          p=Path('materials-center/index.html')
          s=p.read_text(encoding='utf-8')
          b64='""'
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials-center/index.html
          git diff --cached --quiet || (git commit -m 'Apply trash icon' && git push)
