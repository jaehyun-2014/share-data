name: Apply trash icon
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply trash icon exact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact trash icon
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('materials-center/index.html')
          s=p.read_text(encoding='utf-8')
          b64=''
          icon=f'<img class="trash-icon" alt="" src="data:image/png;base64,{b64}">'
          pattern=r'<button data-page="trash">.*?</button>'
          s,n=re.subn(pattern,lambda m:'<button data-page="trash" title="휴지통" aria-label="휴지통">'+icon+'</button>',s,count=1,flags=re.S)
          if not n: raise SystemExit('trash nav button not found')
          css='.trash-icon{width:21px;height:21px;object-fit:contain;display:block;filter:none}nav button[data-page="trash"]{display:inline-flex;align-items:center;justify-content:center}'
          if '.trash-icon{' not in s: s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials-center/index.html
          git diff --cached --quiet || (git commit -m 'Apply trash icon exact' && git push)