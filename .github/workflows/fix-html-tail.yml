name: Fix trailing HTML
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Remove accidental trailing HTML'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trim content after closing html tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('materials-center/index.html')
          s=p.read_text(encoding='utf-8')
          marker='</html>'
          i=s.find(marker)
          if i >= 0:
              clean=s[:i+len(marker)]+'\n'
              if clean != s:
                  p.write_text(clean, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials-center/index.html
          git diff --cached --quiet || (git commit -m 'Remove accidental trailing HTML' && git push)
