name: Apply trash icon v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply trash icon v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('materials-center/index.html')
          s=p.read_text(encoding='utf-8')
          b64=''
          icon=f'<img class="trash-icon" alt="" src="data:image/png;base64,{b64}">'
          old='data-page="trash">휴지통</button>'
          new='data-page="trash">'+icon+'</button>'
          if old in s:
              s=s.replace(old,new,1)
          else:
              raise SystemExit('trash navigation text not found')
          if '.trash-icon{' not in s:
              s=s.replace('</style>','.trash-icon{width:21px;height:21px;object-fit:contain;display:block}\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials-center/index.html
          git diff --cached --quiet || (git commit -m 'Apply trash icon v2' && git push)
