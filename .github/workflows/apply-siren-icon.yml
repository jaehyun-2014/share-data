name: Apply siren icon
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply siren icon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch report button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('materials-center/index.html')
          s=p.read_text(encoding='utf-8')
          icon='''<img class="siren-icon" alt="" src="data:image/png;base64,">'''
          old='''onclick="reportMaterial('${m.id}')">⚑</button>'''
          new='''onclick="reportMaterial('${m.id}',this)">'''+icon+'''</button>'''
          if old not in s: raise SystemExit('report button not found')
          s=s.replace(old,new,1)
          s=s.replace('.icon-btn:hover{background:#f9fafb}', '.icon-btn:hover{background:#f9fafb}.siren-icon{width:21px;height:21px;object-fit:contain;display:block}.icon-btn.siren-active .siren-icon{filter:brightness(0) saturate(100%) invert(18%) sepia(96%) saturate(5572%) hue-rotate(354deg) brightness(87%) contrast(117%)}',1)
          s=s.replace('async function reportMaterial(id){','async function reportMaterial(id,button){',1)
          old2='''if(error){alert("신고 실패: "+error.message);return}\n  alert("신고가 접수되었습니다. 관리자 확인 후 처리됩니다.")'''
          new2='''if(error){alert("신고 실패: "+error.message);return}\n  if(button)button.classList.add("siren-active");\n  alert("신고가 접수되었습니다. 관리자 확인 후 처리됩니다.")'''
          if old2 not in s: raise SystemExit('report success block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials-center/index.html
          git diff --cached --quiet || (git commit -m 'Apply siren icon' && git push)