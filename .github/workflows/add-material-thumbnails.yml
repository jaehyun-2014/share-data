name: Add material thumbnails

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Move material thumbnail beside management'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move thumbnail beside management controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('materials-center/index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the thumbnail from the title area.
          s = re.sub(
              r'(<strong>\$\{escapeHtml\(m\.title\)\}</strong>)<span class="material-thumb"[^>]*></span>',
              r'\1',
              s,
              count=1
          )

          # Put the thumbnail at the beginning of the management section.
          marker = '<div class="icon-actions">'
          thumb = '<span class="material-thumb" data-material-thumb data-storage-path="${encodeURIComponent(m.storage_path||\"\")}" data-file-name="${escapeHtml(m.file_name||\"\")}"></span>'
          if marker in s and 'data-material-thumb' in s:
              s = s.replace(marker, marker + thumb, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials-center/index.html
          git diff --cached --quiet || (git commit -m 'Move material thumbnail beside management' && git push)
