name: Fix table layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Make recent and library lists tables'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore table layout on mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('materials-center/index.html')
          s=p.read_text(encoding='utf-8')
          old='''table{min-width:0;width:100%}\nthead{display:none}\ntbody,tr,td{display:block;width:100%}\ntr{background:#fff;border:1px solid #e4e7ec;border-radius:10px;margin-bottom:12px;padding:10px}\ntd{border:0;padding:7px 4px;font-size:14px;word-break:break-word}\ntd:nth-child(1)::before{content:"자료";font-weight:700;color:#475467;display:block;margin-bottom:3px}\ntd:nth-child(2)::before{content:"작성자";font-weight:700;color:#475467;display:block;margin-bottom:3px}\ntd:nth-child(3)::before{content:"날짜";font-weight:700;color:#475467;display:block;margin-bottom:3px}\ntd:nth-child(4)::before{content:"관리";font-weight:700;color:#475467;display:block;margin-bottom:6px}\ntd button{margin:2px 4px 2px 0}'''
          new='''table{min-width:680px;width:100%}\nthead{display:table-header-group}\ntbody{display:table-row-group}\ntr{display:table-row;background:transparent;border:0;border-radius:0;margin:0;padding:0}\ntd{display:table-cell;border-bottom:1px solid #eaecf0;padding:14px;font-size:14px;word-break:normal}\ntd::before{content:none!important}\ntd button{margin:2px 4px 2px 0}'''
          if old in s:
              s=s.replace(old,new)
          else:
              import re
              s=re.sub(r'table\\{min-width:0;width:100%\\}\\nthead\\{display:none\\}\\ntbody,tr,td\\{display:block;width:100%\\}\\ntr\\{.*?\\}\\ntd\\{.*?\\}\\ntd:nth-child\\(1\\)::before\\{.*?\\}\\ntd:nth-child\\(2\\)::before\\{.*?\\}\\ntd:nth-child\\(3\\)::before\\{.*?\\}\\ntd:nth-child\\(4\\)::before\\{.*?\\}\\ntd button\\{.*?\\}', new, s, count=1, flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Fix download behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('materials-center/index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('async function downloadMaterial(id){')
          end=s.find('\nasync function deleteMaterial(id){', start)
          if start < 0 or end < 0:
              raise SystemExit('download function not found')
          new='''async function downloadMaterial(id){
  const m=materials.find(x=>x.id===id);if(!m)return;
  const {data,error}=await supabaseClient.storage.from("materials").createSignedUrl(m.storage_path,300,{download:m.file_name||true});
  if(error||!data?.signedUrl){alert("파일을 다운로드할 수 없습니다.");return}
  try{
    const res=await fetch(data.signedUrl);
    if(!res.ok)throw new Error("download failed");
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=m.file_name||"download";a.style.display="none";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){
    const a=document.createElement("a");a.href=data.signedUrl;a.download=m.file_name||"download";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
  }
}'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials-center/index.html
          git diff --cached --quiet || (git commit -m 'Make recent and library lists tables' && git push)
