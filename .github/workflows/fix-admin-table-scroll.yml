name: Fix post trash icon
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Add material image thumbnails'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix layout, trash icon and material thumbnails
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('materials-center/index.html')
          s=p.read_text(encoding='utf-8')

          # Top navigation must remain text.
          s=re.sub(r'<button data-page="trash"[^>]*>.*?</button>', '<button data-page="trash">휴지통</button>', s, count=1, flags=re.S)

          # Keep recent-materials table inside a horizontal scroll area.
          css='#recentHome{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}'
          if '#recentHome{' not in s:
              s=s.replace('</style>',css+'\n</style>',1)

          # Use an inline SVG for post delete buttons so there is no broken image.
          trash_svg='<svg class="trash-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zm-3 6h12l-1 12H7L6 9zm3 2v8h2v-8H9zm4 0v8h2v-8h-2z"/></svg>'
          pattern=r'(<button[^>]*class="icon-btn icon-danger"[^>]*>)(?:×|<img[^>]*>|<svg[^>]*class="trash-icon"[^>]*>.*?</svg>)(</button>)'
          s=re.sub(pattern, lambda m:m.group(1)+trash_svg+m.group(2), s)
          css2='.trash-icon{width:22px;height:22px;display:block;fill:currentColor}'
          if '.trash-icon{' not in s:
              s=s.replace('</style>',css2+'\n</style>',1)

          # Add a small image thumbnail beside each material title.
          marker='<strong>${escapeHtml(m.title)}</strong>'
          thumb='<strong>${escapeHtml(m.title)}</strong><span class="material-thumb" data-material-thumb data-storage-path="${encodeURIComponent(m.storage_path||\"\")}" data-file-name="${escapeHtml(m.file_name||\"\")}"></span>'
          if 'data-material-thumb' not in s:
              if marker not in s:
                  raise SystemExit('materialRow title marker not found')
              s=s.replace(marker,thumb,1)

          # Thumbnail styling.
          if '.material-thumb{' not in s:
              css3='.material-title-wrap{display:inline-flex;align-items:center;gap:2px}.material-thumb{display:inline-flex;width:36px;height:36px;margin-left:8px;vertical-align:middle;border:1px solid #d0d5dd;border-radius:7px;overflow:hidden;background:#f2f4f7;align-items:center;justify-content:center}.material-thumb img{width:100%;height:100%;object-fit:cover;display:block}.material-thumb.empty{display:none}'
              s=s.replace('</style>',css3+'\n</style>',1)

          # Load private Storage images with short-lived signed URLs.
          if 'async function hydrateMaterialThumbs()' not in s:
              fn='''\nasync function hydrateMaterialThumbs(){\n  const els=[...document.querySelectorAll('[data-material-thumb]:not([data-thumb-loaded])')];\n  await Promise.all(els.map(async el=>{\n    el.dataset.thumbLoaded='1';\n    const name=(el.dataset.fileName||'').toLowerCase();\n    const path=decodeURIComponent(el.dataset.storagePath||'');\n    if(!path || !/\\.(jpg|jpeg|png|gif|webp|bmp|svg)$/i.test(name)){el.classList.add('empty');return}\n    try{\n      const result=await supabaseClient.storage.from('materials').createSignedUrl(path,3600);\n      if(result.error||!result.data?.signedUrl){el.classList.add('empty');return}\n      el.innerHTML='<img src="'+result.data.signedUrl+'" alt="" loading="lazy">';\n    }catch(e){el.classList.add('empty')}\n  }));\n}\n\nif(document.body){\n  new MutationObserver(()=>hydrateMaterialThumbs()).observe(document.body,{childList:true,subtree:true});\n}\n'''
              s=s.replace('\nfunction renderHome(){',fn+'\nfunction renderHome(){',1)

          p.write_text(s,encoding='utf-8')
          print('thumbnail patch complete')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials-center/index.html
          git diff --cached --quiet || (git commit -m 'Add material image thumbnails' && git push)
