name: Fix admin table horizontal scroll
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix admin table horizontal scroll'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix admin table and trash icon
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('materials-center/index.html')
          s=p.read_text(encoding='utf-8')
          marker='.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}'
          addition='.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.admin-grid>div{min-width:0}#adminMaterials,#adminReports{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}'
          if marker in s:
              s=s.replace(marker,addition,1)
          elif '#adminMaterials,#adminReports' not in s:
              s=s.replace('</style>',addition+'\n</style>',1)
          b64=''
          icon=f'<img class="trash-icon" alt="" src="data:image/png;base64,{b64}">'
          pattern=r'<button data-page="trash">.*?</button>'
          s,n=re.subn(pattern,lambda m:'<button data-page="trash" title="휴지통" aria-label="휴지통">'+icon+'</button>',s,count=1,flags=re.S)
          if n:
              css='.trash-icon{width:21px;height:21px;object-fit:contain;display:block;filter:none}nav button[data-page="trash"]{display:inline-flex;align-items:center;justify-content:center}'
              if '.trash-icon{' not in s:
                  s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials-center/index.html
          git diff --cached --quiet || (git commit -m 'Fix admin table horizontal scroll' && git push)
