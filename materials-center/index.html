<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자료 공유센터</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;background:#f4f6f9;color:#222}header{background:#1f2937;color:#fff;padding:20px 6%;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-size:24px;font-weight:700}nav{display:flex;gap:6px;flex-wrap:wrap}button{font-family:inherit}nav button,.auth button{background:transparent;color:#fff;border:0;padding:10px 14px;border-radius:7px;font-size:15px;cursor:pointer}nav button:hover,nav button.active{background:#374151}.auth{display:flex;align-items:center;gap:8px}.user-email{font-size:13px;color:#d1d5db;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}main{max-width:1100px;margin:35px auto;padding:0 20px}.page{display:none}.page.active{display:block}.hero{background:#fff;border-radius:14px;padding:45px 35px;box-shadow:0 3px 15px rgba(0,0,0,.06);margin-bottom:25px}.hero h1{font-size:34px;margin-bottom:12px}.hero p{color:#667085}.search{display:flex;gap:10px;margin-top:25px}input,textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:13px;font-size:15px;outline:none}input:focus,textarea:focus{border-color:#667085}.search button,.primary{background:#1f2937;color:#fff;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;font-size:15px}.secondary{background:#fff;color:#1f2937;border:1px solid #d0d5dd;border-radius:8px;padding:11px 16px;cursor:pointer;font-size:15px}.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 3px 15px rgba(0,0,0,.05);margin-bottom:20px}.card h2{font-size:20px;margin-bottom:18px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:15px;border-bottom:1px solid #eaecf0}th{background:#f9fafb;font-size:14px;color:#475467}td{font-size:14px}.download{border:1px solid #d0d5dd;background:#fff;border-radius:7px;padding:8px 12px;cursor:pointer;margin-right:5px}.download:hover{background:#f2f4f7}.danger{color:#b42318}.empty{text-align:center;color:#667085;padding:35px}.form-row{margin-bottom:16px}.form-row label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.file{padding:10px;background:#f9fafb;border:1px dashed #d0d5dd;border-radius:8px}.notice{padding:18px;border:1px solid #e4e7ec;border-radius:8px;margin-bottom:12px;background:#fff}.notice strong{display:block;margin-bottom:7px;font-size:16px}.notice-date{color:#667085;font-size:13px;margin-bottom:10px}.notice-content{line-height:1.6;white-space:pre-wrap}.info{background:#f8fafc;border:1px solid #e4e7ec;border-radius:9px;padding:14px;line-height:1.6;color:#475467;margin-bottom:16px}.message{margin-top:12px;font-size:14px;color:#475467;white-space:pre-wrap}.auth-card{max-width:520px;margin:auto}.admin-box{margin-top:25px;padding:20px;background:#f8fafc;border:1px solid #e4e7ec;border-radius:10px}.admin-status{margin-top:12px;font-size:14px;color:#475467}.logout-note{font-size:11px;color:#98a2b3;margin-top:4px;max-width:280px;line-height:1.4}.logout-wrap{display:flex;flex-direction:column;align-items:flex-end}.hidden{display:none!important}@media(max-width:800px){header{flex-direction:column;align-items:flex-start}.user-email{max-width:280px}.hero{padding:30px 22px}.hero h1{font-size:27px}}@media(max-width:600px){nav{width:100%}nav button{flex:1}.auth{width:100%;justify-content:space-between}.logout-wrap{align-items:flex-start}.search{flex-direction:column}.search button{width:100%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><div class="logo">자료 공유센터</div><nav><button class="active" data-page="home">홈</button><button data-page="library">자료실</button><button data-page="upload">자료 올리기</button><button data-page="notice">공지사항</button></nav><div class="auth"><span id="userEmail" class="user-email">로그인 필요</span><button id="loginNav" onclick="openPage('auth')">로그인</button><div id="logoutWrap" class="logout-wrap hidden"><button id="logoutNav" onclick="logout()">로그아웃</button><div class="logout-note">이 페이지를 닫기 전, 로그아웃 하십시오. 기기에 로그인상태가 저장될 수 있습니다.</div></div></div></header>
<main>
<section id="home" class="page active"><div class="hero"><h1>자료 공유센터</h1><p>학교 친구들과 필요한 자료를 편리하게 공유하세요.</p><div class="search"><input id="homeSearch" placeholder="자료 제목이나 작성자를 검색하세요."><button class="primary" onclick="searchFromHome()">검색</button></div></div><div class="card"><h2>최근 자료</h2><div id="recentHome"></div></div></section>
<section id="library" class="page"><div class="card"><h2>자료실</h2><div class="search" style="margin-top:0"><input id="librarySearch" placeholder="자료를 검색하세요." oninput="renderLibrary()"><button onclick="showAllMaterials()">전체 보기</button></div><div class="table-wrap" style="margin-top:18px"><table><thead><tr><th>자료 이름</th><th>작성자</th><th>업로드 날짜</th><th>관리</th></tr></thead><tbody id="libraryBody"></tbody></table></div></div></section>
<section id="upload" class="page"><div class="card"><h2>자료 올리기</h2><div class="form-row"><label>자료 제목</label><input id="title" placeholder="자료 제목을 입력하세요."></div><div class="form-row"><label>작성자</label><input id="author" placeholder="이름을 입력하세요."></div><div class="form-row"><label>파일</label><input id="file" class="file" type="file"></div><div class="form-row"><label>설명</label><textarea id="description" rows="4" placeholder="자료에 대한 설명을 입력하세요."></textarea></div><button class="primary" onclick="addMaterial()">자료 등록</button><p id="uploadMessage" class="message"></p></div></section>
<section id="notice" class="page"><div class="card"><h2>공지사항</h2><div id="noticeList"></div><div id="adminLoginArea" class="admin-box"><strong>관리자</strong><p style="margin-top:7px;color:#667085">공지사항은 관리자만 작성할 수 있습니다.</p><button class="primary" style="margin-top:15px" onclick="adminLogin()">관리자 로그인</button><p id="adminStatus" class="admin-status"></p></div><div id="adminNoticeArea" class="admin-box" style="display:none"><h3>공지 작성</h3><input id="noticeTitle" style="margin-top:15px" placeholder="공지 제목"><textarea id="noticeText" rows="5" style="margin-top:10px" placeholder="공지 내용을 입력하세요."></textarea><button class="primary" style="margin-top:10px" onclick="addNotice()">공지 등록</button></div></div></section>
<section id="auth" class="page"><div class="card auth-card"><h2>로그인 / 회원가입</h2><div class="info">학교 자료 공유센터입니다. 이메일과 비밀번호로 로그인하거나 새 계정을 만들 수 있습니다.<br>회원가입 후 이메일 인증이 필요한 경우, 받은 인증 메일의 링크를 눌러주세요.</div><div class="form-row"><label>이메일</label><input id="email" type="email" placeholder="example@gmail.com"></div><div class="form-row"><label>비밀번호</label><input id="password" type="password" placeholder="6자 이상"></div><button class="primary" onclick="login()">이메일 로그인</button> <button class="secondary" onclick="signup()">이메일 회원가입</button><p id="authMessage" class="message"></p></div></section>
</main>
<script>
const SUPABASE_URL="https://qugdtljqifagaanrelxq.supabase.co";
const SUPABASE_KEY="sb_publishable_K1mj11BXsdVYBWroata6cg_g9WKcfL4";
const ADMIN_EMAIL="여기에_관리자_이메일";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,materials=[],notices=[];
const $=id=>document.getElementById(id);
function escapeHtml(t){return String(t??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function dateText(v){return new Date(v||Date.now()).toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"})}
function isAdmin(){return !!currentUser&&ADMIN_EMAIL!=="여기에_관리자_이메일"&&currentUser.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase()}
function openPage(id){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===id));if(id==="home")renderHome();if(id==="library")renderLibrary();if(id==="notice")renderNotices();window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>openPage(b.dataset.page));
function updateAuthUI(){if(currentUser){$("userEmail").textContent=currentUser.email||"로그인됨";$("loginNav").classList.add("hidden");$("logoutWrap").classList.remove("hidden")}else{$("userEmail").textContent="로그인 필요";$("loginNav").classList.remove("hidden");$("logoutWrap").classList.add("hidden")}}
async function login(){const email=$("email").value.trim(),password=$("password").value,msg=$("authMessage");if(!email||!password){msg.textContent="이메일과 비밀번호를 입력해주세요.";return}msg.textContent="로그인 중...";const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){msg.textContent="로그인 실패: "+error.message;return}msg.textContent="로그인되었습니다.";await updateAuthUI();await loadAll();openPage("home")}
async function signup(){const email=$("email").value.trim(),password=$("password").value,msg=$("authMessage");if(!email||!password){msg.textContent="이메일과 비밀번호를 입력해주세요.";return}if(password.length<6){msg.textContent="비밀번호는 6자 이상이어야 합니다.";return}msg.textContent="회원가입 중...";const {data,error}=await supabaseClient.auth.signUp({email,password});if(error){msg.textContent="회원가입 실패: "+error.message;return}if(data.session){msg.textContent="회원가입 및 로그인이 완료되었습니다.";await updateAuthUI();await loadAll();openPage("home")}else{msg.innerHTML="회원가입이 완료되었습니다.<br><strong>입력한 이메일의 인증 메일을 확인한 뒤 로그인해주세요.</strong>"}}
async function logout(){await supabaseClient.auth.signOut();currentUser=null;materials=[];notices=[];updateAuthUI();openPage("home");alert("로그아웃되었습니다.")}
async function loadMaterials(){if(!currentUser){materials=[];return}const {data,error}=await supabaseClient.from("materials").select("id,owner_id,title,author,description,file_name,storage_path,created_at").order("created_at",{ascending:false});if(error){console.error(error);return}materials=data||[]}
async function loadNotices(){if(!currentUser){notices=[];return}const {data,error}=await supabaseClient.from("notices").select("id,title,content,created_at").order("created_at",{ascending:false});if(error){console.error(error);return}notices=data||[]}
async function loadAll(){await Promise.all([loadMaterials(),loadNotices()]);renderHome();renderLibrary();renderNotices()}
function materialRow(m){const canDelete=currentUser&&m.owner_id===currentUser.id;return `<tr><td><strong>${escapeHtml(m.title)}</strong></td><td>${escapeHtml(m.author)}</td><td>${escapeHtml(dateText(m.created_at))}</td><td><button class="download" onclick="downloadMaterial('${m.id}')">다운로드</button>${canDelete?`<button class="download danger" onclick="deleteMaterial('${m.id}')">삭제</button>`:""}</td></tr>`}
function renderHome(){const box=$("recentHome");if(!currentUser){box.innerHTML=`<div class="empty">자료를 보려면 로그인해주세요.</div>`;return}const list=materials.slice(0,5);box.innerHTML=list.length?`<div class="table-wrap"><table><thead><tr><th>자료 이름</th><th>작성자</th><th>업로드 날짜</th><th>관리</th></tr></thead><tbody>${list.map(materialRow).join("")}</tbody></table></div>`:`<div class="empty">아직 등록된 자료가 없습니다.</div>`}
function renderLibrary(){const body=$("libraryBody");if(!currentUser){body.innerHTML=`<tr><td colspan="4" class="empty">자료를 보려면 로그인해주세요.</td></tr>`;return}const q=($("librarySearch")?.value||"").toLowerCase();const list=materials.filter(m=>(m.title+" "+m.author+" "+(m.description||"")).toLowerCase().includes(q));body.innerHTML=list.length?list.map(materialRow).join(""):`<tr><td colspan="4" class="empty">등록된 자료가 없습니다.</td></tr>`}
function showAllMaterials(){$("librarySearch").value="";renderLibrary()}
function searchFromHome(){const q=$("homeSearch").value;openPage("library");$("librarySearch").value=q;renderLibrary()}
async function addMaterial(){if(!currentUser){alert("자료를 올리려면 먼저 로그인해주세요.");openPage("auth");return}const title=$("title").value.trim(),author=$("author").value.trim(),file=$("file").files[0],description=$("description").value.trim(),msg=$("uploadMessage");if(!title||!author||!file){msg.textContent="자료 제목, 작성자, 파일을 모두 입력해주세요.";return}if(file.size>50*1024*1024){msg.textContent="파일은 50MB 이하로 올려주세요.";return}msg.textContent="업로드 중...";const safe=file.name.replace(/[^\w가-힣.\-() ]/g,"_");const path=`${currentUser.id}/${crypto.randomUUID()}-${safe}`;const {error:upErr}=await supabaseClient.storage.from("materials").upload(path,file);if(upErr){msg.textContent="파일 업로드 실패: "+upErr.message;return}const {error:dbErr}=await supabaseClient.from("materials").insert({owner_id:currentUser.id,title,author,description,file_name:file.name,storage_path:path});if(dbErr){await supabaseClient.storage.from("materials").remove([path]);msg.textContent="자료 정보 저장 실패: "+dbErr.message;return}$("title").value="";$("author").value="";$("file").value="";$("description").value="";msg.textContent="자료가 등록되었습니다.";await loadMaterials();renderHome();renderLibrary()}
async function downloadMaterial(id){const m=materials.find(x=>x.id===id);if(!m)return;const {data,error}=await supabaseClient.storage.from("materials").createSignedUrl(m.storage_path,60);if(error||!data?.signedUrl){alert("파일을 열 수 없습니다.");return}const a=document.createElement("a");a.href=data.signedUrl;a.download=m.file_name;a.target="_blank";document.body.appendChild(a);a.click();a.remove()}
async function deleteMaterial(id){if(!currentUser)return;const m=materials.find(x=>x.id===id);if(!m)return;if(m.owner_id!==currentUser.id){alert("이 자료를 올린 사람만 삭제할 수 있습니다.");return}if(!confirm("이 자료를 삭제할까요?"))return;const {error:sErr}=await supabaseClient.storage.from("materials").remove([m.storage_path]);if(sErr){alert("파일 삭제 실패: "+sErr.message);return}const {error:dErr}=await supabaseClient.from("materials").delete().eq("id",id).eq("owner_id",currentUser.id);if(dErr){alert("자료 정보 삭제 실패: "+dErr.message);return}await loadMaterials();renderHome();renderLibrary()}
function renderNotices(){if(!currentUser){$("noticeList").innerHTML=`<div class="empty">공지사항을 보려면 로그인해주세요.</div>`;$("adminNoticeArea").style.display="none";return}$("adminNoticeArea").style.display=isAdmin()?"block":"none";$("adminLoginArea").style.display="block";if(!notices.length){$("noticeList").innerHTML=`<div class="empty">등록된 공지사항이 없습니다.</div>`;return}$("noticeList").innerHTML=notices.map(n=>`<div class="notice"><strong>${escapeHtml(n.title)}</strong><div class="notice-date">${escapeHtml(dateText(n.created_at))}</div><div class="notice-content">${escapeHtml(n.content)}</div>${isAdmin()?`<button class="download danger" style="margin-top:12px" onclick="deleteNotice('${n.id}')">삭제</button>`:""}</div>`).join("")}
async function adminLogin(){if(!currentUser){alert("먼저 로그인해주세요.");openPage("auth");return}if(isAdmin()){$("adminStatus").textContent="현재 관리자 계정으로 로그인되어 있습니다.";return}$("adminStatus").textContent="현재 로그인한 계정은 관리자 계정이 아닙니다."}
async function addNotice(){if(!isAdmin()){alert("관리자만 공지를 작성할 수 있습니다.");return}const title=$("noticeTitle").value.trim(),content=$("noticeText").value.trim();if(!title||!content){$("adminStatus").textContent="공지 제목과 내용을 입력해주세요.";return}const {error}=await supabaseClient.from("notices").insert({title,content});if(error){$("adminStatus").textContent="공지 등록 실패: "+error.message;return}$("noticeTitle").value="";$("noticeText").value="";$("adminStatus").textContent="공지가 등록되었습니다.";await loadNotices();renderNotices()}
async function deleteNotice(id){if(!isAdmin())return;if(!confirm("이 공지를 삭제할까요?"))return;const {error}=await supabaseClient.from("notices").delete().eq("id",id);if(error){alert("공지 삭제 실패: "+error.message);return}await loadNotices();renderNotices()}
async function init(){const {data}=await supabaseClient.auth.getSession();currentUser=data.session?.user||null;updateAuthUI();await loadAll()}
supabaseClient.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;updateAuthUI();if(currentUser)await loadAll()});
init();
</script>
</body>
</html>
