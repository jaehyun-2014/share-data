<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자료 공유센터</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;background:#f4f6f9;color:#222}header{background:#1f2937;color:#fff;padding:16px 6%;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.logo{font-size:24px;font-weight:700}nav{display:flex;gap:5px;flex-wrap:wrap}button{font-family:inherit;cursor:pointer}nav button,.auth button{background:transparent;color:#fff;border:0;padding:9px 12px;border-radius:7px;font-size:14px}nav button:hover,nav button.active,.auth button:hover{background:#374151}.auth{display:flex;align-items:center;gap:6px}.user-email{font-size:13px;color:#d1d5db;max-width:190px;overflow:hidden;text-overflow:ellipsis}.logout-wrap{display:flex;flex-direction:column;align-items:flex-end}.logout-note{font-size:11px;color:#98a2b3;margin-top:4px;max-width:280px;line-height:1.4}.hidden{display:none!important}main{max-width:1100px;margin:35px auto;padding:0 20px}.page{display:none}.page.active{display:block}.hero,.card{background:#fff;border-radius:14px;padding:28px;box-shadow:0 3px 15px rgba(0,0,0,.06);margin-bottom:20px}.hero{padding:42px 35px}.hero h1{font-size:34px;margin-bottom:12px}.hero p{color:#667085}.search{display:flex;gap:10px;margin-top:22px}input,textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:12px;font-size:15px;outline:none}input:focus,textarea:focus{border-color:#667085}.primary{background:#1f2937;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:15px}.secondary,.download{background:#fff;border:1px solid #d0d5dd;border-radius:7px;padding:8px 12px}.danger{color:#b42318!important}.card h2{font-size:20px;margin-bottom:18px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:14px;border-bottom:1px solid #eaecf0}th{background:#f9fafb;font-size:14px;color:#475467}td{font-size:14px}.empty{text-align:center;color:#667085;padding:35px}.form-row{margin-bottom:16px}.form-row label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.file{padding:10px;background:#f9fafb;border:1px dashed #d0d5dd;border-radius:8px}.notice{padding:18px;border:1px solid #e4e7ec;border-radius:8px;margin-bottom:12px;background:#fff}.notice strong{display:block;margin-bottom:7px;font-size:16px}.notice-date{color:#667085;font-size:13px;margin-bottom:10px}.notice-content{line-height:1.6;white-space:pre-wrap}.info{background:#f8fafc;border:1px solid #e4e7ec;border-radius:9px;padding:14px;line-height:1.6;color:#475467;margin-bottom:16px}.message{margin-top:12px;font-size:14px;color:#475467;white-space:pre-wrap}.auth-card{max-width:520px;margin:auto}@media(max-width:800px){header{flex-direction:column;align-items:flex-start}.user-email{max-width:280px}.hero{padding:30px 22px}.hero h1{font-size:27px}}@media(max-width:600px){
nav{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
nav button{width:100%;min-width:0;padding:9px 5px;font-size:13px;white-space:normal}
.auth{width:100%;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.logout-wrap{align-items:flex-start;max-width:100%}
.logout-note{max-width:220px}
.search{flex-direction:column}
.search button{width:100%}
main{padding:0 12px;margin:20px auto}
.hero,.card{padding:20px 16px;border-radius:12px}
.hero{padding:26px 18px}
.hero h1{font-size:25px}
.card h2{font-size:19px}
.admin-grid{gap:14px}
.table-wrap{overflow:visible}
table{min-width:680px;width:100%}
thead{display:table-header-group}
tbody{display:table-row-group}
tr{display:table-row;background:transparent;border:0;border-radius:0;margin:0;padding:0}
td{display:table-cell;border-bottom:1px solid #eaecf0;padding:14px;font-size:14px;word-break:normal}
td::before{content:none!important}
td button{margin:2px 4px 2px 0}
}

.profile-line{font-size:12px;color:#d1d5db;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2f7;color:#475467;font-size:11px}
.report-btn{background:#fff;border:1px solid #f0b7b2;color:#b42318;border-radius:7px;padding:8px 12px}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.report-item{border:1px solid #e4e7ec;border-radius:10px;padding:15px;margin-bottom:12px;background:#fff}
.report-meta{font-size:13px;color:#667085;margin:7px 0;line-height:1.5}
@media(max-width:700px){.admin-grid{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><div class="logo">자료 공유센터</div><nav><button class="active" data-page="home">홈</button><button data-page="library">자료실</button><button data-page="upload">자료 올리기</button><button data-page="notice">공지사항</button><button id="adminNav" class="hidden" data-page="admin">관리자</button></nav><div class="auth"><div><span id="userEmail" class="user-email">로그인 필요</span><div id="userName" class="profile-line"></div></div><button id="loginNav" onclick="openPage('auth')">로그인</button><button id="profileNav" class="hidden" onclick="openPage('profile')">내 정보</button><div id="logoutWrap" class="logout-wrap hidden"><button id="logoutNav" onclick="logout()">로그아웃</button><div class="logout-note">이 페이지를 닫기 전, 로그아웃 하십시오. 기기에 로그인상태가 저장될 수 있습니다.</div></div></div></header>
<main>
<section id="home" class="page active"><div class="hero"><h1>자료 공유센터</h1><p>필요한 자료를 편리하게 공유하세요.</p><div class="search"><input id="homeSearch" placeholder="자료 제목이나 작성자를 검색하세요."><button class="primary" onclick="searchFromHome()">검색</button></div></div><div class="card"><h2>최근 자료</h2><div id="recentHome"></div></div></section>
<section id="library" class="page"><div class="card"><h2>자료실</h2><div class="search" style="margin-top:0"><input id="librarySearch" placeholder="자료를 검색하세요." oninput="renderLibrary()"><button class="primary" onclick="showAllMaterials()">전체 보기</button></div><div class="table-wrap" style="margin-top:18px"><table><thead><tr><th>자료 이름</th><th>작성자</th><th>업로드 날짜</th><th>관리</th></tr></thead><tbody id="libraryBody"></tbody></table></div></div></section>
<section id="upload" class="page"><div class="card"><h2>자료 올리기</h2><div id="uploadLoginInfo" class="info">자료를 올리려면 이메일로 로그인해야 합니다.</div><div class="form-row"><label>자료 제목</label><input id="title" placeholder="자료 제목을 입력하세요."></div><div class="form-row"><label>작성자(닉네임)</label><input id="author" placeholder="내 닉네임"></div><div class="form-row"><label>파일</label><input id="file" class="file" type="file"></div><div class="form-row"><label>설명</label><textarea id="description" rows="4" placeholder="자료에 대한 설명을 입력하세요."></textarea></div><button class="primary" onclick="addMaterial()">자료 등록</button><p id="uploadMessage" class="message"></p></div></section>
<section id="notice" class="page"><div class="card"><h2>공지사항</h2><div id="noticeList"></div><div id="adminNoticeArea" class="info" style="display:none"><strong>관리자 공지 작성</strong><input id="noticeTitle" style="margin-top:12px" placeholder="공지 제목"><textarea id="noticeText" rows="5" style="margin-top:10px" placeholder="공지 내용을 입력하세요."></textarea><button class="primary" style="margin-top:10px" onclick="addNotice()">공지 등록</button><p id="adminStatus" class="message"></p></div></div></section>

<section id="profile" class="page"><div class="card"><h2>내 정보</h2>
<div class="form-row"><label>이름/닉네임</label><input id="profileName" maxlength="30" placeholder="표시할 이름 또는 닉네임"></div>
<div class="form-row"><label>이메일</label><input id="profileEmail" disabled></div>
<button class="primary" onclick="saveProfile()">저장</button><p id="profileMessage" class="message"></p>
</div></section>

<section id="admin" class="page"><div class="card"><h2>관리자 페이지</h2>
<div class="admin-grid">
<div><h2>전체 자료 관리</h2><div id="adminMaterials"></div></div>
<div><h2>자료 신고 관리</h2><div id="adminReports"></div></div>
</div></div></section>

<section id="auth" class="page"><div class="card auth-card"><h2>이메일 로그인</h2><div class="form-row"><label>이메일</label><input id="email" type="email" placeholder="이메일 주소"></div><div class="form-row"><label>비밀번호</label><input id="password" type="password" placeholder="비밀번호"></div><button class="primary" onclick="login()">이메일 로그인</button> <button class="secondary" onclick="signup()">이메일 회원가입</button><p id="authMessage" class="message"></p></div></section>
</main>
<script>
const SUPABASE_URL="https://qugdtljqifagaanrelxq.supabase.co";
const SUPABASE_KEY="sb_publishable_K1mj11BXsdVYBWroata6cg_g9WKcfL4";
const ADMIN_EMAIL="jh.kim1579@senedu.kr";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function isConfigured(){return SUPABASE_KEY&&!SUPABASE_KEY.includes("여기에_")&&SUPABASE_URL.includes("supabase.co")}
function showConfigError(){const msg="Supabase 연결 설정이 아직 완료되지 않았습니다.";["authMessage","uploadMessage","adminStatus"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=msg})}

let currentUser=null,materials=[],notices=[],profile=null,reports=[];const $=id=>document.getElementById(id);

function escapeHtml(t){return String(t??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function dateText(v){return new Date(v||Date.now()).toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"})}
function isAdmin(){return !!currentUser&&ADMIN_EMAIL!==""&&currentUser.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase()}
function displayNameFor(m){return m.author||"이름 없음"}

function openPage(id){
  if((id==="admin"||id==="profile")&&!currentUser){alert("먼저 로그인해주세요.");openPage("auth");return}
  if(id==="admin"&&!isAdmin()){alert("관리자만 이용할 수 있습니다.");openPage("home");return}
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  $(id).classList.add("active");
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===id));
  if(id==="home")renderHome();
  if(id==="library")renderLibrary();
  if(id==="notice")renderNotices();
  if(id==="upload")updateUploadState();
  if(id==="profile")loadProfileUI();
  if(id==="admin")renderAdmin();
  scrollTo({top:0,behavior:"smooth"})
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>openPage(b.dataset.page));

async function updateAuthUI(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  currentUser=session?.user||null;
  $("userEmail").textContent=currentUser?.email||"로그인 필요";
  $("loginNav").style.display=currentUser?"none":"inline-block";
  $("logoutWrap").classList.toggle("hidden",!currentUser);
  $("profileNav").classList.toggle("hidden",!currentUser);
  $("adminNav").classList.toggle("hidden",!isAdmin());
  if(currentUser){
    await loadProfile();
    $("userName").textContent=profile?.display_name?("이름: "+profile.display_name):"이름/닉네임 미설정";
    $("author").value=profile?.display_name||currentUser.email.split("@")[0];
  }else{
    profile=null;$("userName").textContent="";
  }
  updateUploadState();renderNotices();
}

function updateUploadState(){$("uploadLoginInfo").textContent=currentUser?"로그인됨: "+currentUser.email:"자료를 올리려면 먼저 로그인해야 합니다."}

async function login(){
  if(!isConfigured()){showConfigError();return}
  const email=$("email").value.trim(),password=$("password").value,msg=$("authMessage");
  if(!email||!password){msg.textContent="이메일과 비밀번호를 입력해주세요.";return}
  msg.textContent="로그인 중...";
  try{
    const result=await supabaseClient.auth.signInWithPassword({email,password});
    if(result.error){msg.textContent="로그인 실패: "+result.error.message;return}
    msg.textContent="로그인되었습니다.";await updateAuthUI();await loadAll();openPage("home")
  }catch(e){msg.textContent="로그인 오류: "+(e?.message||String(e))}
}

async function signup(){
  if(!isConfigured()){showConfigError();return}
  const email=$("email").value.trim(),password=$("password").value,msg=$("authMessage");
  if(!email||!password){msg.textContent="이메일과 비밀번호를 입력해주세요.";return}
  if(password.length<6){msg.textContent="비밀번호는 6자 이상이어야 합니다.";return}
  msg.textContent="회원가입 중...";
  try{
    const dataResult=await supabaseClient.auth.signUp({email,password});
    if(dataResult.error){msg.textContent="회원가입 실패: "+dataResult.error.message;return}
    if(dataResult.data.session){msg.textContent="회원가입 및 로그인이 완료되었습니다.";await updateAuthUI();await loadAll();openPage("profile")}
    else{msg.innerHTML="회원가입이 완료되었습니다.<br><strong>인증 메일을 확인한 뒤 로그인해주세요.</strong>"}
  }catch(e){msg.textContent="회원가입 오류: "+(e?.message||String(e))}
}

async function logout(){await supabaseClient.auth.signOut();currentUser=null;materials=[];notices=[];profile=null;reports=[];await updateAuthUI();openPage("home")}

async function loadProfile(){
  if(!currentUser){profile=null;return}
  const {data,error}=await supabaseClient.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();
  if(error){console.error(error);return}
  profile=data||{id:currentUser.id,display_name:""};
}
function loadProfileUI(){
  $("profileEmail").value=currentUser?.email||"";
  $("profileName").value=profile?.display_name||"";
  $("profileMessage").textContent="";
}
async function saveProfile(){
  if(!currentUser)return;
  const name=$("profileName").value.trim();
  if(!name){$("profileMessage").textContent="이름/닉네임을 입력해주세요.";return}
  const {error}=await supabaseClient.from("profiles").upsert({id:currentUser.id,display_name:name},{onConflict:"id"});
  if(error){$("profileMessage").textContent="저장 실패: "+error.message;return}
  profile={...(profile||{}),id:currentUser.id,display_name:name};
  $("author").value=name;$("userName").textContent="이름: "+name;
  $("profileMessage").textContent="저장되었습니다.";
  await loadMaterials();renderHome();renderLibrary();
}

async function loadMaterials(){
  if(!currentUser){materials=[];return}
  const {data,error}=await supabaseClient.from("materials").select("*").order("created_at",{ascending:false});
  if(error){console.error(error);return}
  materials=data||[];
}
async function loadNotices(){
  if(!currentUser){notices=[];return}
  const {data,error}=await supabaseClient.from("notices").select("*").order("created_at",{ascending:false});
  if(error){console.error(error);return}
  notices=data||[];
}
async function loadReports(){
  if(!currentUser||!isAdmin()){reports=[];return}
  const {data,error}=await supabaseClient.from("admin_material_reports").select("*").order("created_at",{ascending:false});
  if(error){console.error(error);return}
  reports=data||[];
}
async function loadAll(){await Promise.all([loadMaterials(),loadNotices(),loadReports()]);renderHome();renderLibrary();renderNotices();if(isAdmin())renderAdmin()}

function materialRow(m){
  const canDelete=currentUser&&m.owner_id===currentUser.id;
  return `<tr><td><strong>${escapeHtml(m.title)}</strong>${m.description?`<div style="color:#667085;margin-top:5px">${escapeHtml(m.description)}</div>`:""}</td>
  <td>${escapeHtml(displayNameFor(m))}</td><td>${dateText(m.created_at)}</td><td>
  <button class="download" onclick="downloadMaterial('${m.id}')">다운로드</button>
  <button class="report-btn" onclick="reportMaterial('${m.id}')">신고</button>
  ${canDelete?` <button class="download danger" onclick="deleteMaterial('${m.id}')">삭제</button>`:""}</td></tr>`
}
function renderHome(){
  const box=$("recentHome");if(!currentUser){box.innerHTML=`<div class="empty">자료를 보려면 로그인해주세요.</div>`;return}
  const list=materials.slice(0,5);if(!list.length){box.innerHTML=`<div class="empty">아직 등록된 자료가 없습니다.</div>`;return}
  box.innerHTML=`<div class="table-wrap"><table><thead><tr><th>자료 이름</th><th>작성자</th><th>업로드 날짜</th><th>관리</th></tr></thead><tbody>${list.map(materialRow).join("")}</tbody></table></div>`
}
function renderLibrary(){
  if(!currentUser){$("libraryBody").innerHTML=`<tr><td colspan="4" class="empty">자료를 보려면 로그인해주세요.</td></tr>`;return}
  const q=($("librarySearch")?.value||"").toLowerCase();
  const list=materials.filter(m=>(m.title+" "+m.author+" "+(m.description||"")).toLowerCase().includes(q));
  $("libraryBody").innerHTML=list.length?list.map(materialRow).join(""):`<tr><td colspan="4" class="empty">등록된 자료가 없습니다.</td></tr>`
}
function showAllMaterials(){$("librarySearch").value="";renderLibrary()}
function searchFromHome(){const q=$("homeSearch").value;openPage("library");$("librarySearch").value=q;renderLibrary()}

async function addMaterial(){
  if(!isConfigured()){showConfigError();return}
  if(!currentUser){alert("자료를 올리려면 먼저 로그인해주세요.");openPage("auth");return}
  const title=$("title").value.trim(),author=($("author").value.trim()||profile?.display_name||currentUser.email.split("@")[0]),file=$("file").files[0],description=$("description").value.trim(),msg=$("uploadMessage");
  if(!title||!file){msg.textContent="자료 제목과 파일을 입력해주세요.";return}
  if(file.size>50*1024*1024){msg.textContent="파일은 50MB 이하로 올려주세요.";return}
  msg.textContent="업로드 중...";
  const safe=file.name.replace(/[^\w가-힣.\-() ]/g,"_"),path=`${currentUser.id}/${crypto.randomUUID()}-${safe}`;
  const {error:upErr}=await supabaseClient.storage.from("materials").upload(path,file);
  if(upErr){msg.textContent="파일 업로드 실패: "+upErr.message;return}
  const {error:dbErr}=await supabaseClient.from("materials").insert({owner_id:currentUser.id,title,author,description,file_name:file.name,storage_path:path});
  if(dbErr){await supabaseClient.storage.from("materials").remove([path]);msg.textContent="자료 정보 저장 실패: "+dbErr.message;return}
  $("title").value="";$("file").value="";$("description").value="";msg.textContent="자료가 등록되었습니다.";
  await loadMaterials();renderHome();renderLibrary()
}

async function downloadMaterial(id){
  const m=materials.find(x=>x.id===id);if(!m)return;
  const {data,error}=await supabaseClient.storage.from("materials").createSignedUrl(m.storage_path,60);
  if(error||!data?.signedUrl){alert("파일을 열 수 없습니다.");return}
  const a=document.createElement("a");a.href=data.signedUrl;a.download=m.file_name;a.target="_blank";document.body.appendChild(a);a.click();a.remove()
}
async function deleteMaterial(id){
  if(!currentUser)return;const m=materials.find(x=>x.id===id);if(!m)return;
  if(m.owner_id!==currentUser.id&&!isAdmin()){alert("삭제 권한이 없습니다.");return}
  if(!confirm("이 자료를 삭제할까요?"))return;
  const {error:sErr}=await supabaseClient.storage.from("materials").remove([m.storage_path]);
  if(sErr){alert("파일 삭제 실패: "+sErr.message);return}
  const {error:dErr}=await supabaseClient.from("materials").delete().eq("id",id);
  if(dErr){alert("자료 정보 삭제 실패: "+dErr.message);return}
  await loadMaterials();await loadReports();renderHome();renderLibrary();if(isAdmin())renderAdmin()
}

async function reportMaterial(id){
  if(!currentUser){alert("신고하려면 먼저 로그인해주세요.");openPage("auth");return}
  const m=materials.find(x=>x.id===id);if(!m)return;
  const reason=prompt("신고 사유를 입력해주세요.");
  if(reason===null)return;
  if(!reason.trim()){alert("신고 사유를 입력해주세요.");return}
  const {error}=await supabaseClient.from("material_reports").insert({material_id:m.id,reporter_id:currentUser.id,reason:reason.trim()});
  if(error?.code==="23505"){alert("이미 신고한 자료입니다.");return}
  if(error){alert("신고 실패: "+error.message);return}
  alert("신고가 접수되었습니다. 관리자 확인 후 처리됩니다.")
}

function renderNotices(){
  if(!currentUser){$("noticeList").innerHTML=`<div class="empty">공지사항을 보려면 로그인해주세요.</div>`;$("adminNoticeArea").style.display="none";return}
  $("adminNoticeArea").style.display=isAdmin()?"block":"none";
  if(!notices.length){$("noticeList").innerHTML=`<div class="empty">등록된 공지사항이 없습니다.</div>`;return}
  $("noticeList").innerHTML=notices.map(n=>`<div class="notice"><strong>${escapeHtml(n.title)}</strong><div class="notice-date">${dateText(n.created_at)}</div><div class="notice-content">${escapeHtml(n.content)}</div>${isAdmin()?`<button class="download danger" style="margin-top:12px" onclick="deleteNotice('${n.id}')">삭제</button>`:""}</div>`).join("")
}
async function addNotice(){
  if(!isAdmin()){alert("관리자만 공지를 작성할 수 있습니다.");return}
  const title=$("noticeTitle").value.trim(),content=$("noticeText").value.trim();
  if(!title||!content){$("adminStatus").textContent="공지 제목과 내용을 입력해주세요.";return}
  $("adminStatus").textContent="등록 중...";
  const {error}=await supabaseClient.from("notices").insert({title,content,author_id:currentUser.id});
  if(error){$("adminStatus").textContent="공지 등록 실패: "+error.message;return}
  $("noticeTitle").value="";$("noticeText").value="";$("adminStatus").textContent="공지가 등록되었습니다.";await loadNotices();renderNotices()
}
async function deleteNotice(id){
  if(!isAdmin()){alert("관리자만 공지를 삭제할 수 있습니다.");return}
  if(!confirm("이 공지를 삭제할까요?"))return;
  const {error}=await supabaseClient.from("notices").delete().eq("id",id);
  if(error){alert("공지 삭제 실패: "+error.message);return}await loadNotices();renderNotices()
}

function renderAdmin(){
  if(!isAdmin())return;
  $("adminMaterials").innerHTML=materials.length?`<div class="table-wrap"><table><thead><tr><th>자료</th><th>작성자</th><th>날짜</th><th>관리</th></tr></thead><tbody>${materials.map(m=>`<tr><td><strong>${escapeHtml(m.title)}</strong></td><td>${escapeHtml(m.author)}</td><td>${dateText(m.created_at)}</td><td><button class="download danger" onclick="deleteMaterial('${m.id}')">삭제</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">등록된 자료가 없습니다.</div>`;
  $("adminReports").innerHTML=reports.length?reports.map(r=>`<div class="report-item"><strong>${escapeHtml(r.material_title||"자료 신고")}</strong><div class="report-meta">신고 사유: ${escapeHtml(r.reason)}<br>신고일: ${dateText(r.created_at)}</div><button class="secondary" onclick="resolveReport('${r.id}')">처리 완료</button><button class="download danger" style="margin-left:6px" onclick="deleteReportedMaterial('${r.id}')">자료 삭제</button></div>`).join(""):`<div class="empty">처리할 신고가 없습니다.</div>`;
}
async function resolveReport(id){
  if(!isAdmin())return;
  const {error}=await supabaseClient.from("material_reports").delete().eq("id",id);
  if(error){alert("처리 실패: "+error.message);return}
  await loadReports();renderAdmin()
}
async function deleteReportedMaterial(reportId){
  if(!isAdmin())return;
  const r=reports.find(x=>x.id===reportId);if(!r)return;
  if(!confirm("신고된 자료를 삭제할까요?"))return;
  if(r.material_id){
    const m=materials.find(x=>x.id===r.material_id);
    if(m){
      const {error:sErr}=await supabaseClient.storage.from("materials").remove([m.storage_path]);
      if(sErr){alert("파일 삭제 실패: "+sErr.message);return}
      const {error:dErr}=await supabaseClient.from("materials").delete().eq("id",m.id);
      if(dErr){alert("자료 삭제 실패: "+dErr.message);return}
    }
  }
  await loadMaterials();await loadReports();renderAdmin();renderHome();renderLibrary()
}
supabaseClient.auth.onAuthStateChange(()=>{setTimeout(async()=>{await updateAuthUI();await loadAll()},0)});(async()=>{await updateAuthUI();await loadAll()})();
</script>
</body>
</html>
